[package]
name = "safeselect"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
description = "Fail-closed read-only database access for AI agents over MCP"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
toml = "1.1.2"
toml_edit = "0.25.13"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
sha2 = "0.11.0"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
zip = "9.0.1"
similar = "3.1.1"
semver = "1"
indoc = "2"
inquire = "0.9"
rpassword = "7"
sqlparser = { version = "0.63.0", features = ["visitor"] }


[profile.release]
strip = true
lto = true
codegen-units = 1
