name: Verify

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Unit & Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build sidecar
        run: |
          mvn -f sidecar/pom.xml package -DskipTests
          cp sidecar/target/safeselect-sidecar-*.jar sidecar/target/safeselect-sidecar.jar
      - name: Check compilation
        run: cargo check
      - name: All tests (unit + smoke)
        run: cargo test
        env:
          CARGO_TERM_COLOR: always

  integration:
    name: Integration (PostgreSQL)
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 25432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build sidecar
        run: |
          mvn -f sidecar/pom.xml package -DskipTests
          cp sidecar/target/safeselect-sidecar-*.jar sidecar/target/safeselect-sidecar.jar
      - name: Download PostgreSQL driver
        run: cargo run -- driver download --vendor postgresql
      - name: Integration tests
        run: cargo test --test integration
        env:
          SAFESELECT_INTEGRATION_TEST: "1"
          SAFESELECT_INT_TEST_PASSWORD: testpass

  integration-mongodb:
    name: Integration (MongoDB)
    needs: unit
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: testpass
          MONGO_INITDB_DATABASE: admin
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh mongodb://root:testpass@localhost:27017/admin --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build sidecar
        run: |
          mvn -f sidecar/pom.xml package -DskipTests
          cp sidecar/target/safeselect-sidecar-*.jar sidecar/target/safeselect-sidecar.jar
      - name: Run real MongoDB security tests
        run: cargo test --test security real_mongodb_security_rejections_and_limits -- --nocapture
        env:
          SAFESELECT_SECURITY_TEST: "1"
          SAFESELECT_MONGODB_HOST: localhost
          SAFESELECT_MONGODB_PORT: 27017
          SAFESELECT_MONGODB_ADMIN_USER: root
          SAFESELECT_MONGODB_ADMIN_PASSWORD: testpass

  security:
    name: Security & Licenses
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-binstall
        run: curl -fsSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install audit & deny tools
        shell: bash
        run: |
          cargo binstall cargo-audit --locked -q
          cargo binstall cargo-deny --locked -q
      - name: Run cargo audit
        run: cargo audit
      - name: Run cargo deny
        run: cargo deny check

  crap-report:
    name: CRAP (report-only)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install coverage tools
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-crap
        run: cargo install cargo-crap --locked
      - name: Install makevn
        run: |
          curl -fsSL https://raw.githubusercontent.com/antonillos/makevn/main/packaging/install/install-release.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build crap4java fork through makevn
        run: |
          git clone --depth 1 https://github.com/antonillos/crap4java.git ../crap4java
          makevn --repo "${GITHUB_WORKSPACE}/../crap4java" init --force
          makevn --repo "${GITHUB_WORKSPACE}/../crap4java" package
      - name: Run report-only CRAP analysis
        run: ./tools/crap/run.sh --summary
        env:
          CRAP4JAVA_JAR: ${{ github.workspace }}/../crap4java/target/crap4java-0.1.0-SNAPSHOT.jar
      - name: Upload CRAP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crap-report
          path: target/crap/
