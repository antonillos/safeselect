name: Verify

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      badge_only:
        description: Refresh the CRAP badge without running the full verification suite
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.policy.outputs.profile }}
      docs: ${{ steps.policy.outputs.docs }}
      crap: ${{ steps.policy.outputs.crap }}
      unit: ${{ steps.policy.outputs.unit }}
      postgres: ${{ steps.policy.outputs.postgres }}
      mongodb: ${{ steps.policy.outputs.mongodb }}
      security: ${{ steps.policy.outputs.security }}
      real_integration: ${{ steps.policy.outputs.real_integration }}
    steps:
      - uses: actions/checkout@v7
      - id: policy
        name: Select validation profile
        uses: actions/github-script@v9
        with:
          script: |
            const { classifyPaths, fullPolicy } = require("./.github/scripts/ci-path-policy.js");
            const pull = context.payload.pull_request;
            let policy;
            if (pull) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                per_page: 100,
              });
              policy = classifyPaths(files.map((file) => file.filename));
              const label = "safe-to-merge";
              const labels = pull.labels.map((item) => item.name);
              if (!pull.head.repo.fork) {
                if (policy.realIntegration && !labels.includes(label)) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pull.number,
                    labels: [label],
                  });
                } else if (!policy.realIntegration && labels.includes(label)) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pull.number,
                    name: label,
                  });
                }
              } else if (policy.realIntegration) {
                core.warning("Fork PR requires real integration but cannot be labelled with the read-only token.");
              }
            } else {
              policy = fullPolicy("full");
              policy.realIntegration = false;
            }
            for (const [name, value] of Object.entries({
              profile: policy.profile,
              docs: policy.docs,
              crap: policy.crap,
              unit: policy.unit,
              postgres: policy.postgres,
              mongodb: policy.mongodb,
              security: policy.security,
              real_integration: policy.realIntegration,
            })) core.setOutput(name, String(value));
            await core.summary.addHeading("Validation profile").addTable([
              [{data: "Profile", header: true}, {data: policy.profile}],
              [{data: "Jobs", header: true}, {data: Object.entries(policy)
                .filter(([name, value]) => name !== "profile" && value)
                .map(([name]) => name).join(", ") || "none"}],
            ]).write();

  docs:
    name: Documentation
    needs: classify
    if: inputs.badge_only != true && needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Markdown and internal links
        run: python3 tools/ci/validate_docs.py

  website:
    name: Website and positioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Markdown and internal links
        run: python3 tools/ci/validate_docs.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked website dependencies
        run: npm ci --prefix site --ignore-scripts
      - name: Validate generated icon assets
        run: |
          npm run icons:export --prefix site -- --check
          npm run test:icons --prefix site
      - name: Build and validate static website
        run: |
          npm run build:pages --prefix site
          npm run typecheck --prefix site
          npm run lint --prefix site
          python3 tools/ci/validate_site.py
          python3 -m unittest discover -s tools/ci -p 'test_site_validation.py' -v
      - name: Upload static website
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: website-pages
          path: site/out/
          include-hidden-files: true

  unit:
    name: Unit & Smoke
    if: >-
      always() && inputs.badge_only != true &&
      needs.classify.outputs.unit == 'true' && needs.crap-report.result == 'success'
    needs: [classify, crap-report]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release pipeline and installer
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Test LobeHub manifest exporter
        run: python3 -m unittest discover -s tools/distribution -p 'test_*.py' -v
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
      - name: Test CI policies
        run: node --test .github/scripts/*.test.js
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install makevn
        uses: ./.github/actions/setup-makevn
      - name: Initialize, test, and package sidecar
        run: |
          makevn doctor init test package
          cp sidecar/target/safeselect-sidecar-*.jar sidecar/target/safeselect-sidecar.jar
      - name: Compile and run all tests (unit + smoke)
        run: cargo test
        env:
          CARGO_TERM_COLOR: always
      - name: Validate MCPB packaging helpers
        shell: bash
        run: |
          set -euo pipefail
          cargo build
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | sed -n '1p')"
          asset="safeselect-v${version}-x86_64-unknown-linux-gnu.mcpb"
          scripts/package-mcpb.sh \
            --binary target/debug/safeselect \
            --target x86_64-unknown-linux-gnu \
            --version "${version}" \
            --output "${RUNNER_TEMP}/${asset}"
          unzip -t "${RUNNER_TEMP}/${asset}"
          unzip -p "${RUNNER_TEMP}/${asset}" manifest.json | python3 -m json.tool >/dev/null
          checksum="$(sha256sum "${RUNNER_TEMP}/${asset}" | awk '{print $1}')"
          scripts/generate-registry-server-json.sh \
            --version "${version}" \
            --release-url "https://github.com/antonillos/safeselect/releases/download/v${version}" \
            --output "${RUNNER_TEMP}/server.json" \
            "${asset}=${checksum}"
          python3 -m json.tool "${RUNNER_TEMP}/server.json" >/dev/null

      - name: Check LobeHub tools against the current source
        shell: bash
        run: |
          set -euo pipefail
          # Never use a preinstalled binary or automatically rewrite the manifest.
          cargo build --locked
          driver="${RUNNER_TEMP}/lobehub-postgresql-42.7.4.jar"
          driver_sha="188976721ead8e8627eb6d8389d500dccc0c9bebd885268a3047180274a6031e"
          curl --fail --silent --show-error --location --max-time 60 \
            https://jdbc.postgresql.org/download/postgresql-42.7.4.jar --output "$driver"
          printf '%s  %s\n' "$driver_sha" "$driver" | sha256sum --check
          python3 tools/distribution/update_lobehub_manifest.py \
            --binary "${GITHUB_WORKSPACE}/target/debug/safeselect" \
            --postgres-driver "$driver" \
            --driver-sha256 "$driver_sha" \
            --check

  integration:
    name: Integration (PostgreSQL)
    needs: [classify, unit]
    if: >-
      always() && inputs.badge_only != true &&
      needs.classify.outputs.postgres == 'true' && needs.unit.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 25432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install makevn
        uses: ./.github/actions/setup-makevn
      - name: Initialize, test, and package sidecar
        run: |
          makevn doctor init test package
          cp sidecar/target/safeselect-sidecar-*.jar sidecar/target/safeselect-sidecar.jar
      - name: Download PostgreSQL driver
        run: cargo run -- driver download --vendor postgresql
      - name: Integration tests
        run: cargo test --test integration
        env:
          SAFESELECT_INTEGRATION_TEST: "1"
          SAFESELECT_INT_TEST_PASSWORD: testpass

  integration-mongodb:
    name: Integration (MongoDB)
    needs: [classify, unit]
    if: >-
      always() && inputs.badge_only != true &&
      needs.classify.outputs.mongodb == 'true' && needs.unit.result == 'success'
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: testpass
          MONGO_INITDB_DATABASE: admin
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh mongodb://root:testpass@localhost:27017/admin --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install makevn
        uses: ./.github/actions/setup-makevn
      - name: Initialize, test, and package sidecar
        run: |
          makevn doctor init test package
          cp sidecar/target/safeselect-sidecar-*.jar sidecar/target/safeselect-sidecar.jar
      - name: Run real MongoDB security tests
        run: cargo test --test security real_mongodb_security_rejections_and_limits -- --nocapture
        env:
          SAFESELECT_SECURITY_TEST: "1"
          SAFESELECT_MONGODB_HOST: localhost
          SAFESELECT_MONGODB_PORT: 27017
          SAFESELECT_MONGODB_ADMIN_USER: root
          SAFESELECT_MONGODB_ADMIN_PASSWORD: testpass

  security:
    name: Security & Licenses
    needs: [classify, unit]
    if: >-
      always() && inputs.badge_only != true &&
      needs.classify.outputs.security == 'true' && needs.unit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-binstall
        run: curl -fsSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install audit & deny tools
        shell: bash
        run: |
          cargo binstall cargo-audit --locked -q
          cargo binstall cargo-deny --locked -q
      - name: Run cargo audit
        run: cargo audit
      - name: Run cargo deny
        run: cargo deny check

  crap-report:
    name: CRAP (ratchet <=80)
    needs: classify
    if: inputs.badge_only == true || needs.classify.outputs.crap == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install coverage tools
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-binstall
        run: curl -fsSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install cargo-crap
        run: cargo binstall cargo-crap --locked -q
      - name: Install makevn
        uses: ./.github/actions/setup-makevn
      - name: Build sidecar for Rust embedding
        run: |
          makevn doctor init test package
          cp sidecar/target/safeselect-sidecar-*.jar sidecar/target/safeselect-sidecar.jar
      - name: Download pinned crap4java release
        run: |
          curl -fsSL \
            -o "${GITHUB_WORKSPACE}/../crap4java-0.1.0.jar" \
            "https://github.com/antonillos/crap4java/releases/download/v0.1.0/crap4java-0.1.0.jar"
          printf '%s  %s\n' \
            "b996434078d560d52a058e3d9ffb0d07a9469ecdc57c8b4fa241fa70252bf68e" \
            "${GITHUB_WORKSPACE}/../crap4java-0.1.0.jar" \
            | sha256sum --check
      - name: Run CRAP analysis and ratchet
        run: ./tools/crap/run.sh --summary --ratchet 80
        env:
          CRAP4JAVA_JAR: ${{ github.workspace }}/../crap4java-0.1.0.jar
      - name: Upload CRAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crap-report
          path: target/crap/
      - name: Prepare CRAP badge
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/develop'
        run: |
          mkdir -p target/crap-pages
          cp target/crap/badge.json target/crap-pages/crap-badge.json
      - name: Upload CRAP badge for combined Pages publication
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: pages-badge
          path: target/crap-pages/

  deploy-crap-badge:
    name: Publish website and CRAP badge
    needs: [crap-report, website]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download static website
        uses: actions/download-artifact@v4
        with:
          name: website-pages
          path: target/pages/
      - name: Add current CRAP badge without replacing website
        uses: actions/download-artifact@v4
        with:
          name: pages-badge
          path: target/pages/
      - name: Verify combined publication
        run: |
          test -s target/pages/index.html
          test -s target/pages/sitemap.xml
          test -s target/pages/crap-badge.json
      - name: Upload single Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages/
      - name: Deploy website and CRAP badge
        id: deployment
        uses: actions/deploy-pages@v5

  real-integration:
    name: Real Integration Tests
    needs: classify
    if: inputs.badge_only != true && needs.classify.outputs.real_integration == 'true'
    uses: ./.github/workflows/integration-tests.yml
    with:
      target_ref: ${{ github.event.pull_request.head.sha }}

  verify:
    name: Verify
    needs: [classify, docs, website, crap-report, unit, integration, integration-mongodb, security, real-integration]
    if: always() && inputs.badge_only != true
    runs-on: ubuntu-latest
    env:
      DOCS_REQUIRED: ${{ needs.classify.outputs.docs }}
      CRAP_REQUIRED: ${{ needs.classify.outputs.crap }}
      UNIT_REQUIRED: ${{ needs.classify.outputs.unit }}
      POSTGRES_REQUIRED: ${{ needs.classify.outputs.postgres }}
      MONGODB_REQUIRED: ${{ needs.classify.outputs.mongodb }}
      SECURITY_REQUIRED: ${{ needs.classify.outputs.security }}
      REAL_INTEGRATION_REQUIRED: ${{ needs.classify.outputs.real_integration }}
      DOCS_RESULT: ${{ needs.docs.result }}
      WEBSITE_RESULT: ${{ needs.website.result }}
      CRAP_RESULT: ${{ needs.crap-report.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      POSTGRES_RESULT: ${{ needs.integration.result }}
      MONGODB_RESULT: ${{ needs.integration-mongodb.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      REAL_INTEGRATION_RESULT: ${{ needs.real-integration.result }}
    steps:
      - name: Enforce selected verification jobs
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          check() {
            local name="$1" required="$2" result="$3"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "::error title=Required validation failed::$name concluded $result"
              failed=1
            fi
            printf '%-24s required=%-5s result=%s\n' "$name" "$required" "$result"
          }
          check Documentation "$DOCS_REQUIRED" "$DOCS_RESULT"
          check 'Website and positioning' true "$WEBSITE_RESULT"
          check CRAP "$CRAP_REQUIRED" "$CRAP_RESULT"
          check 'Unit & Smoke' "$UNIT_REQUIRED" "$UNIT_RESULT"
          check 'Integration (PostgreSQL)' "$POSTGRES_REQUIRED" "$POSTGRES_RESULT"
          check 'Integration (MongoDB)' "$MONGODB_REQUIRED" "$MONGODB_RESULT"
          check 'Security & Licenses' "$SECURITY_REQUIRED" "$SECURITY_RESULT"
          check 'Real Integration Tests' "$REAL_INTEGRATION_REQUIRED" "$REAL_INTEGRATION_RESULT"
          exit "$failed"
