name: Publish Package Managers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing public release tag to publish
        required: true
      target_ref:
        description: Optional source commit (defaults to the release tag)
        required: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      target_ref:
        required: false
        type: string
    secrets:
      SAFESELECT_RELEASE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: safeselect-package-managers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v7
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || inputs.version }}
          path: release-source
      - name: Verify complete public release and read checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python3 tools/ci/release.py check-public --source release-source --version "$VERSION"
          arm_mac_sha="$(awk '{print $1}' "dist/release/safeselect-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")"
          intel_mac_sha="$(awk '{print $1}' "dist/release/safeselect-${VERSION}-x86_64-apple-darwin.tar.gz.sha256")"
          printf 'arm-mac-sha=%s\n' "$arm_mac_sha" >> "$GITHUB_OUTPUT"
          printf 'intel-mac-sha=%s\n' "$intel_mac_sha" >> "$GITHUB_OUTPUT"
      - name: Publish Homebrew tap
        env:
          RELEASE_TOKEN: ${{ secrets.SAFESELECT_RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
          ARM_SHA: ${{ steps.checksums.outputs.arm-mac-sha }}
          INTEL_SHA: ${{ steps.checksums.outputs.intel-mac-sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            printf 'Error: SAFESELECT_RELEASE_TOKEN is required to publish Homebrew.\n' >&2
            exit 1
          fi

          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/antonillos/homebrew-tap.git" homebrew-tap
          python3 tools/ci/check_package_version.py homebrew-tap/Formula/safeselect.rb "$VERSION"
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula
          cat > Formula/safeselect.rb <<FORMULA
          class Safeselect < Formula
            desc "Fail-closed read-only database access for AI agents over MCP"
            homepage "https://github.com/antonillos/safeselect"
            license "MIT OR Apache-2.0"

            if Hardware::CPU.arm?
              url "https://github.com/antonillos/safeselect/releases/download/${VERSION}/safeselect-${VERSION}-aarch64-apple-darwin.tar.gz"
              sha256 "${ARM_SHA}"
            else
              url "https://github.com/antonillos/safeselect/releases/download/${VERSION}/safeselect-${VERSION}-x86_64-apple-darwin.tar.gz"
              sha256 "${INTEL_SHA}"
            end

            def install
              bin.install "safeselect"
            end

            def caveats
              <<~EOS
                SafeSelect has been installed. To get started:

                  safeselect --help

                SafeSelect requires Java 17 or newer at runtime. If needed, install it with:

                  brew install openjdk@17

                PostgreSQL requires a JDBC driver. Download it with:

                  safeselect driver download --vendor postgresql

                For MCP (Model Context Protocol) support, install the integration:

                  safeselect agent install opencode --environment <env> --name <name>

                (Run from your project repo — .safeselect/ is auto-detected.)
              EOS
            end

            test do
              assert_match "safeselect #{version}", shell_output("\#{bin}/safeselect --version")
            end
          end
          FORMULA

          if [[ -z "$(git status --porcelain)" ]]; then
            printf 'Homebrew tap already up to date for %s.\n' "${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git add Formula/safeselect.rb
          git commit -m "safeselect ${VERSION}"
          git push origin HEAD:main
          printf 'Updated Homebrew tap for %s.\n' "${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish asdf plugin
        env:
          RELEASE_TOKEN: ${{ secrets.SAFESELECT_RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            printf 'Error: SAFESELECT_RELEASE_TOKEN is required to publish asdf.\n' >&2
            exit 1
          fi

          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/antonillos/asdf-safeselect.git" asdf-safeselect
          cp -R release-source/packaging/asdf/. asdf-safeselect/
          cd asdf-safeselect
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x bin/download bin/install bin/list-all

          if [[ -z "$(git status --porcelain)" ]]; then
            printf 'asdf plugin already up to date for %s.\n' "${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git add .
          git commit -m "Sync safeselect asdf plugin for ${VERSION}"
          git push origin HEAD:main
          printf 'Updated asdf plugin for %s.\n' "${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
