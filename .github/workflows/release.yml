name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.1.0)
        required: true
      target_ref:
        description: Branch or commit to release
        required: true
        default: main
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false
      draft:
        description: Create as draft
        type: boolean
        default: false

# Serialise publication/recovery, including dispatches for different versions.
concurrency:
  group: safeselect-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
      version: ${{ steps.parse.outputs.version }}
      target-ref: ${{ steps.parse.outputs.target-ref }}
      prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
      draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v7
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
          path: release-source
      - name: Validate version and freeze source SHA
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 tools/ci/release.py resolve --source release-source --version "$VERSION"

  integration-tests:
    needs: validate-version
    uses: ./.github/workflows/integration-tests.yml
    with:
      target_ref: ${{ needs.validate-version.outputs.target-ref }}

  build:
    needs: [validate-version, integration-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v7
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-version.outputs.target-ref }}
          path: release-source
      - name: Reuse existing verified release assets
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/release.py reuse --version "$VERSION" --target "$TARGET"
      - name: Install Rust
        if: steps.reuse.outputs.reused != 'true'
        run: rustup toolchain install stable --profile minimal && rustup target add "$TARGET"
      - name: Install cross-compiler
        if: steps.reuse.outputs.reused != 'true' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Java
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Install makevn
        if: steps.reuse.outputs.reused != 'true'
        uses: ./.github/actions/setup-makevn
      - name: Initialize, test, and package sidecar
        if: steps.reuse.outputs.reused != 'true'
        working-directory: release-source
        run: |
          makevn doctor init test package
          cp sidecar/target/safeselect-sidecar-*.jar sidecar/target/safeselect-sidecar.jar
      - name: Build Rust binary
        if: steps.reuse.outputs.reused != 'true'
        working-directory: release-source
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          # A retry must use the same source timestamp, not the current wall clock.
          build_stamp="$(git show -s --format=%cs HEAD)"
          SAFESELECT_BUILD_VERSION="$VERSION ($build_stamp)" cargo build --release --target "$TARGET"
      - name: Run tests (native host only)
        if: steps.reuse.outputs.reused != 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: release-source
        run: cargo test
      - name: Package assets
        if: steps.reuse.outputs.reused != 'true'
        working-directory: release-source
        env:
          SEMVER: ${{ needs.validate-version.outputs.semver }}
        run: |
          mkdir -p ../dist/release
          prefix="safeselect-${VERSION}-${TARGET}"
          tar -czf "../dist/release/$prefix.tar.gz" -C "target/$TARGET/release" safeselect
          scripts/package-mcpb.sh --binary "target/$TARGET/release/safeselect" \
            --target "$TARGET" --version "$SEMVER" --output "../dist/release/$prefix.mcpb"
          cd ../dist/release
          shasum -a 256 "$prefix.tar.gz" > "$prefix.tar.gz.sha256"
          shasum -a 256 "$prefix.mcpb" > "$prefix.mcpb.sha256"
      - name: Stage build artifacts (not a public release)
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  publish-release:
    needs: [validate-version, integration-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v7
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-version.outputs.target-ref }}
          path: release-source
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Generate release notes
        shell: bash
        working-directory: release-source
        run: |
          version="${{ needs.validate-version.outputs.version }}"
          changelog_entry="$(awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\] - " { in_section=1 }
            in_section && /^## \[/ && $0 !~ "^## \\[" version "\\] - " { exit }
            in_section { print }
          ' CHANGELOG.md)"

          if [[ -z "${changelog_entry}" ]]; then
            printf 'Error: missing changelog entry for %s\n' "${version}" >&2
            exit 1
          fi

          {
            printf '# SafeSelect %s\n\n' "${version}"
            printf '%s\n\n' "${changelog_entry}"
            printf '## Install\n\n'
            printf 'Homebrew:\n\n'
            printf '```bash\n'
            printf 'brew install antonillos/tap/safeselect\n'
            printf '```\n\n'
            printf 'asdf:\n\n'
            printf '```bash\n'
            printf 'asdf plugin add safeselect https://github.com/antonillos/asdf-safeselect.git\n'
            printf 'asdf install safeselect latest\n'
            printf 'asdf set -u safeselect latest\n'
            printf '```\n\n'
            printf 'Fallback installer:\n\n'
            printf '```bash\n'
            printf 'curl -fsSL https://raw.githubusercontent.com/antonillos/safeselect/main/packaging/install/install-release.sh | sh\n'
            printf '```\n\n'
            printf '## Assets\n\n'
            printf -- '- Runtime archives for Linux `x86_64`/`arm64` and macOS `x86_64`/`arm64`\n'
            printf -- '- SHA-256 checksum files for each archive\n'
          } > release-notes.md
      - name: Verify, upload missing assets and publish atomically from draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-version.outputs.target-ref }}
          DRAFT: ${{ needs.validate-version.outputs.draft }}
          PRERELEASE: ${{ needs.validate-version.outputs.prerelease }}
        shell: bash
        run: |
          flags=()
          if [[ "$DRAFT" == true ]]; then flags+=(--draft); fi
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          python3 tools/ci/release.py publish --version "$VERSION" --sha "$SOURCE_SHA" \
            --source release-source --notes release-source/release-notes.md "${flags[@]}"

  publish-mcp-registry:
    if: needs.validate-version.outputs.prerelease != 'true' && needs.validate-version.outputs.draft != 'true' && needs.integration-tests.result == 'success'
    runs-on: ubuntu-latest
    needs: [validate-version, publish-release, integration-tests]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Download MCPB checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/checksums
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            gh release download "${VERSION}" --repo "${REPOSITORY}" \
              --pattern "safeselect-${VERSION}-${target}.mcpb.sha256" \
              --dir dist/checksums
          done
      - name: Generate server.json
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
          SEMVER: ${{ needs.validate-version.outputs.semver }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          package_args=()
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            asset="safeselect-${VERSION}-${target}.mcpb"
            checksum_file="dist/checksums/${asset}.sha256"
            checksum="$(awk '{print $1}' "${checksum_file}")"
            package_args+=("${asset}=${checksum}")
          done
          scripts/generate-registry-server-json.sh \
            --version "${SEMVER}" \
            --release-url "https://github.com/${REPOSITORY}/releases/download/${VERSION}" \
            --output dist/server.json \
            "${package_args[@]}"
      - name: Install MCP Registry publisher
        shell: bash
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 4 --retry-max-time 120 \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          printf '%s  %s\n' "${MCP_PUBLISHER_SHA256}" "${archive}" | sha256sum --check --strict
          tar xzf "${archive}" mcp-publisher
      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate dist/server.json
      - name: Publish or verify existing MCP Registry version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: python3 tools/ci/publish_registry.py

  publish-package-managers:
    if: needs.validate-version.outputs.prerelease != 'true' && needs.validate-version.outputs.draft != 'true'
    needs: [validate-version, publish-release]
    uses: ./.github/workflows/publish-package-managers.yml
    with:
      version: ${{ needs.validate-version.outputs.version }}
      target_ref: ${{ needs.validate-version.outputs.target-ref }}
    secrets: inherit
